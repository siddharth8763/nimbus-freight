services:
  mysql:
    image: mysql:8.4
    container_name: nimbus-mysql
    environment:
      MYSQL_DATABASE: nimbus
      MYSQL_USER: nimbus
      MYSQL_PASSWORD: nimbus
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-unimbus", "-pnimbus"]
      interval: 5s
      timeout: 5s
      retries: 20
